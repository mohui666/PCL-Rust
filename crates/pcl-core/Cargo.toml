[package]
name = "pcl-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
sha1.workspace = true
tempfile.workspace = true
regex.workspace = true
dirs = "6"
md-5 = "0.10"
sha2 = "0.10"
toml = "1.1"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell"] }
