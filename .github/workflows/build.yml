name: Rust desktop validation
on:
  workflow_dispatch:
  push:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'scripts/**', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Font derivatives remain runner-local under ignored test-output; never upload them.
      - name: Prepare macOS Chinese fixture fonts
        if: runner.os == 'macOS'
        run: python3 scripts/build-local-pingfang-sfnt.py --style all
      - name: Verify Windows Chinese fixture fonts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in @('msyh.ttc', 'msyhbd.ttc')) {
            $font = Join-Path $env:WINDIR "Fonts/$name"
            if (!(Test-Path -LiteralPath $font -PathType Leaf)) {
              throw "Required Windows Chinese test font is unavailable: $name"
            }
          }
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/pcl-fonts"
          "$RUNNER_TEMP/pcl-fonts/bin/pip" install fonttools==4.60.1
      - name: Build Linux launcher and fonts
        run: PYTHON_BIN="$RUNNER_TEMP/pcl-fonts/bin/python" bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PCL-Rust-Linux-x86_64
          path: dist/PCL-Rust-Linux-x86_64.tar.gz
          if-no-files-found: error
