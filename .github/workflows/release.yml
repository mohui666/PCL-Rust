name: Release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            cli: dist/PCL-Rust-Windows/pcl-cli.exe
          - os: macos-15
            platform: macos-arm64
            cli: dist/PCL Rust.app/Contents/MacOS/pcl-cli
          - os: ubuntu-22.04
            platform: linux-x86_64
            cli: dist/PCL-Rust-Linux-x86_64/pcl-cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font tooling
        run: python -m pip install fonttools==4.60.1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The local font exporter verifies fallback glyphs from cached egui crates.
      - name: Prepare macOS test fonts
        if: runner.os == 'macOS'
        run: python3 scripts/build-local-pingfang-sfnt.py --style all
      - name: Test Windows and macOS
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked
      - name: Test Linux core and headless CLI
        if: runner.os == 'Linux'
        run: cargo test -p pcl-core -p pcl-cli --locked
      - name: Build release with the application key
        shell: bash
        env:
          PCL_BUNDLED_CURSEFORGE_API_KEY: ${{ secrets.PCL_RELEASE_CURSEFORGE_API_KEY }}
          PCL_MACOS_FONT_MODE: noto
          CARGO_BIN: cargo
          PYTHON_BIN: python
        run: |
          python -c 'import os; k=os.environ.get("PCL_BUNDLED_CURSEFORGE_API_KEY", ""); assert 0 < len(k) <= 4096 and all(33 <= ord(c) <= 126 for c in k), "Missing or invalid release application key"'
          case "$RUNNER_OS" in
            Windows) pwsh -File scripts/package-windows.ps1 ;;
            macOS) bash scripts/package-macos.sh ;;
            Linux) bash scripts/package-linux.sh ;;
          esac
      - name: Verify packaged configuration and real downloads on a clean runner
        shell: bash
        env:
          PCL_RELEASE_CLI: ${{ matrix.cli }}
          PCL_RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python scripts/release-smoke.py --cli "$PCL_RELEASE_CLI" --version "$version" --report "dist/release/smoke-$PCL_RELEASE_PLATFORM.json"
      - name: Archive redistributable packages
        run: python scripts/release-package.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
